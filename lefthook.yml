# Lefthook - Git Hooks Manager
# https://github.com/evilmartians/lefthook
#
# Install: brew install lefthook && lefthook install

pre-commit:
  commands:
    dprint-check:
      glob: "**/*.{md,json,yml,yaml}"
      run: dprint check {staged_files}

    brew-style:
      glob: "Formula/*.rb"
      run: brew style {staged_files}

    brew-audit:
      glob: "Formula/*.rb"
      # NOTE: `brew audit [path]` is disabled, must use formula names from a tap.
      # Workaround: create a temporary tap and copy formulas for auditing.
      # See: https://github.com/orgs/Homebrew/discussions/4864
      # See: https://github.com/orgs/Homebrew/discussions/4243
      run: |
        set -eu
        audit_tap="lefthook/audit-$$"
        auditing_formula=""
        cleanup() {
          if [ -n "$auditing_formula" ] && brew help untrust >/dev/null 2>&1; then
            brew untrust --formula "$auditing_formula" >/dev/null 2>&1 || true
          fi
          brew untap "$audit_tap" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        brew tap-new --no-git "$audit_tap"
        audit_formula_dir="$(brew --repository "$audit_tap")/Formula"
        exit_code=0
        for f in {staged_files}; do
          name=$(basename "$f")
          formula=$(basename "$name" .rb)
          cp "$f" "$audit_formula_dir/$name"
          auditing_formula="$audit_tap/$formula"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula "$auditing_formula"
          fi
          if ! brew audit --formula "$auditing_formula"; then
            exit_code=1
          fi
          if brew help untrust >/dev/null 2>&1; then
            brew untrust --formula "$auditing_formula"
          fi
          auditing_formula=""
        done
        exit $exit_code

    workflow-lint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: ghalint run -c tools/lint/ghalint.yaml
      fail_text: "Fix GitHub Actions workflow issues"

    workflow-pin:
      glob: ".github/workflows/*.{yml,yaml}"
      run: pinact run --verify -c tools/lint/pinact.yaml
      fail_text: "Run 'pinact run -u -c tools/lint/pinact.yaml' to pin action versions"

commit-msg:
  commands:
    conventional-commit:
      run: |
        commit_msg=$(head -n1 {1})
        if ! echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+$"; then
          echo "Error: Commit message does not follow conventional commits format."
          echo "Example: feat(bazelle): update formula to v0.2.0"
          exit 1
        fi
